<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS 上传测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0052a3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>OSS 上传测试</h1>

    <div class="test-section">
        <h2>配置信息</h2>
        <p style="color:red;">请在代码中替换占位符后再用于调试，勿提交真实密钥</p>
        <div id="config"></div>
    </div>

    <div class="test-section">
        <h2>上传测试</h2>
        <input type="file" id="fileInput" accept="*/*">
        <br><br>
        <button onclick="testDirectUpload()">直接上传测试</button>
        <button onclick="testFunctionUpload()">函数上传测试</button>
    </div>

    <div class="test-section">
        <h2>结果</h2>
        <div id="result"></div>
    </div>

    <script type="module">
        // OSS 配置 - 请替换为本地临时测试账号，勿提交真实生产密钥
        const ossRegion = 'oss-cn-your-region';
        const ossAccessKeyId = 'your_access_key_id';
        const ossAccessKeySecret = 'your_access_key_secret';
        const ossBucket = 'your-bucket-name';

        // 显示配置信息
        document.getElementById('config').innerHTML = `
            <p><strong>Region:</strong> ${ossRegion}</p>
            <p><strong>Bucket:</strong> ${ossBucket}</p>
            <p><strong>Endpoint:</strong> https://${ossBucket}.${ossRegion}.aliyuncs.com</p>
        `;

        // 动态加载OSS SDK
        async function loadOSS() {
            try {
                // 使用CDN加载OSS SDK
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'https://gosspublic.alicdn.com/aliyun-oss-sdk-6.17.1.min.js';
                    script.onload = () => {
                        if (typeof OSS !== 'undefined') {
                            resolve(OSS);
                        } else {
                            reject(new Error('OSS not loaded'));
                        }
                    };
                    script.onerror = () => reject(new Error('Failed to load OSS SDK'));
                    document.head.appendChild(script);
                });
            } catch (error) {
                document.getElementById('result').innerHTML = `<span class="error">加载OSS SDK失败: ${error.message}</span>`;
                return null;
            }
        }

        // 初始化OSS客户端
        let ossClient = null;

        async function initOSS() {
            const OSS = await loadOSS();
            if (!OSS) return false;

            try {
                ossClient = new OSS({
                    region: ossRegion,
                    accessKeyId: ossAccessKeyId,
                    accessKeySecret: ossAccessKeySecret,
                    bucket: ossBucket,
                    secure: true,
                    cname: false,
                    isRequestPay: false,
                    useFetch: true
                });

                log('✅ OSS客户端初始化成功', 'success');
                return true;
            } catch (error) {
                log(`❌ OSS客户端初始化失败: ${error.message}`, 'error');
                return false;
            }
        }

        // 日志函数
        function log(message, type = 'info') {
            const result = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            result.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            result.scrollTop = result.scrollHeight;
        }

        // 直接上传测试
        window.testDirectUpload = async function() {
            if (!ossClient) {
                const initSuccess = await initOSS();
                if (!initSuccess) return;
            }

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                log('❌ 请先选择文件', 'error');
                return;
            }

            try {
                log(`开始上传文件: ${file.name}`);
                log(`文件大小: ${(file.size / 1024).toFixed(2)} KB`);

                const fileName = `test/${Date.now()}-${file.name}`;
                log(`上传路径: ${fileName}`);

                const result = await ossClient.put(fileName, file);

                if (result.res.status === 200) {
                    log(`✅ 上传成功!`, 'success');
                    log(`文件URL: ${result.url}`, 'success');
                    log(`响应状态: ${result.res.status}`, 'success');

                    // 测试访问
                    testFileAccess(result.url);
                } else {
                    log(`❌ 上传失败，状态码: ${result.res.status}`, 'error');
                }
            } catch (error) {
                log(`❌ 上传异常: ${error.message}`, 'error');
                log(`错误详情: ${error.stack}`, 'error');
            }
        };

        // 函数上传测试（使用你的项目函数）
        window.testFunctionUpload = async function() {
            try {
                log('测试项目中的uploadFileToPath函数...');

                // 创建测试文件
                const testContent = 'Hello OSS Test from Function!';
                const blob = new Blob([testContent], { type: 'text/plain' });
                const testFile = new File([blob], 'function-test.txt', { type: 'text/plain' });

                // 这里需要你的项目的函数
                log('⚠️ 需要在实际项目中使用 uploadFileToPath 函数');
            } catch (error) {
                log(`❌ 函数上传测试失败: ${error.message}`, 'error');
            }
        };

        // 测试文件访问
        function testFileAccess(url) {
            log(`\n测试文件访问...`);
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        log(`✅ 文件可以正常访问`, 'success');
                    } else {
                        log(`❌ 文件访问失败: ${response.status} ${response.statusText}`, 'error');
                    }
                })
                .catch(error => {
                    log(`❌ 文件访问异常: ${error.message}`, 'error');
                });
        }

        // 初始化
        initOSS();
    </script>
</body>
</html>
